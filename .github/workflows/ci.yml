name : CI Pipeline

on: 
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

jobs:
    logs:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                node-version: 18
            
            - name: Verify Node
              run: |
                node -v
                npm -v